version: '2'

services:
        barcode-1:
            extends:
                file: barcode_dc/app.yml
                service: app
            networks:
                internal:
                    aliases:
                        - bs1.docker.local
            logging:
                driver: syslog
                options:
                    tag: docker-barcode-1
            restart: unless-stopped
            environment:
                - USER_CONFIG_FILE=./config/config_1.toml
       
        character-ui:
            extends:
                file: character_ui/app.yml
                service: app
            networks:
                internal:
                    aliases:
                        - local-ui.docker.local
            logging:
                driver: syslog
                options:
                    tag: docker-local-ui
            restart: unless-stopped

        mqtt-broker:
            extends:
                file: mqtt_broker/app.yml
                service: app
            networks:
                internal:
                    aliases:
                        - mqtt.docker.local
            logging:
                    driver: syslog
                    options:
                            tag: docker-mqtt
            restart: unless-stopped

networks:
        internal:
            name: shoestring-internal
